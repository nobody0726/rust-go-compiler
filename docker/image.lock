# ── 层构成 ──────────────────────────────────────────────────────────────────
# 层 1  FROM golang:1.27.1-bookworm 按 index digest 钉死（见上）
#       + arm64 架构断言（不是 arm64 立刻失败）
# 层 2  clang / llvm / lld / lldb / make / pkg-config / file / curl / perl / sudo
# 层 3  非 root 用户 dev（uid/gid 与宿主对齐）+ sudoers 免密
# 层 4  rustup + 钉版工具链（channel 由 rust-toolchain.toml 解析）
# 层 5  /etc/profile.d/50-rgoc-toolchains.sh —— 修「登录 shell 找不到工具链」
# 层 6  回归断言：bash -lc 必须能解析 cargo / go

# ── 命名卷（D-M0-9，T18 基准后决定）─────────────────────────────────────────
volumes.cargo_registry  = rgoc-cargo-registry → /home/dev/.cargo/registry
volumes.cargo_git       = rgoc-cargo-git      → /home/dev/.cargo/git
volumes.target          = rgoc-target         → /work/rgoc/target
# 依据：120 模块 crate 冷构建 —— 宿主 bind mount 0.287–0.359s vs 命名卷 0.133–0.150s（≈2.3×）
# 代价 1：新建空卷属主为 root:root，dev 写入报 Permission denied
#          → in-container.sh 做 bootstrap chown；devcontainer 走 postCreateCommand
# 代价 2：`cargo clean` 因卷挂载点无法 rmdir 而报 EBUSY(16)、exit 101
#          → 清空改用 `find rgoc/target -mindepth 1 -delete`
# 注意：宿主侧的 `rgoc/target/` 只是 Docker 的挂载点，**应当是空的** ——
#       卷的内容存在 Docker VM 里，不会出现在宿主路径下。
#       若在宿主侧看到构建产物，说明它们是切换到卷布局【之前】的残留，可直接删除。

# ── 更新记录 ────────────────────────────────────────────────────────────────
# 2026-10-02  初版。
#   T06 首次实现依赖 rustup 的 auto-installation（`rustup show` 触发），
#   构建日志报「auto-installation is deprecated ... may stop working in the future」。
#   遂改为显式 `rustup toolchain install`（channel 由解析 rust-toolchain.toml
#   得到，版本来源仍唯一，D-M0-8），并加非空断言。重建后警告消除。
#
# 2026-10-02  新增层 5（登录 shell 的 PATH）。实测缺陷：
#   镜像用 ENV PATH 注入 cargo bin；但登录 shell 会执行 /etc/profile，
#   【无条件】把 PATH 重置为 /usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games。
#   结果 `bash -lc 'cargo --version'` → command not found（go 同样）。
#   VSCode 集成终端默认以登录 shell 启动 —— 不修这条，用户在编辑器里敲 cargo
#   就是 command not found，CodeLLDB 的 cargo 集成也会失败。
#   验证过 Debian bookworm 的顺序是「先重置 PATH、后 source /etc/profile.d/*.sh」，
#   故上层写一处即可（曾同时写 ~/.profile，实测 PATH 前缀被叠加两次，已移除）。
#   同时加层 6 断言，作为这个缺陷的回归测试。
#
# 2026-10-02  新增 sudo 与 sudoers 免密。用途单一且必需：
#   D-M0-9 决定把 rgoc/target/ 放到命名卷，而新建空卷属主是 root:root，
#   dev 无法写入（实测 `failed to create directory target/debug: Permission denied`）。
#   devcontainer 的 postCreateCommand 需以 root 修正属主，没有 sudo 无解。
#
# 2026-10-02  记录「image id 不可复现」这一事实（见文件头与 benchmarks §4）。
#
# 2026-10-02  层 2 增加 /usr/local/bin/lldb 包装脚本 + 输出断言。实测缺陷：
#   `lldb --version` 抛 ModuleNotFoundError: No module named
#   'lldb.embedded_interpreter'（python3-lldb-14 已装、模块也确实在
#   /usr/lib/llvm-14/lib/python3.11/dist-packages/lldb/，但
#   /usr/lib/python3/dist-packages/lldb 是【相对符号链接】，python 把它
#   解析成 namespace package —— `import lldb` 成功而 __file__ 为 None ——
#   内嵌解释器因此找不到子模块）。
#   修法：包装脚本注入 PYTHONPATH（不设全局环境变量，避免遮蔽其它 python 包的搜索路径）。
#   断言必须查【输出】而非退出码：损坏态会打 traceback 但退出码仍是 0。
#   验证：which lldb -> /usr/local/bin/lldb；lldb --version -> lldb version 14.0.6。
#
# 2026-10-02  记录 CodeLLDB「无法下载」的根因（不是网络）：宿主 VSCode 的
