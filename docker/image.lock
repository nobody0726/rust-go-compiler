#      容器内核 6.12.76-linuxkit → 7.0.14-linuxkit。
#      内核由 Docker Desktop 控制、无法单独钉（见文件头与 04 §5），
#      按该节的处置纪律：**记录变更 + 重跑门禁**，而不是默认接受。
