#      引擎架构仍为 aarch64，与首发平台一致，无偏差。
#
#   2) 【Dockerfile 层 2】增加 apt 重试配置（Acquire::Retries=5 + 超时）。
#      实测两次构建各失败一次，报502 Bad Gateway [IP: 198.18.0.34]
#      （Clash TUN 的假 IP 段），且**失败包每次不同**
#      （第一次 libnspr4、第二次 python3-lldb-14）—— 即不是特定包的问题，
#      而是 129 MB 批量下载长连接上的偶发抖动。宿主单独 curl 同一URL
#      连续 3 次全200，确认非配置错误。
#      apt 默认【不重试】，一个抖动就让整层失败、构建重来（+2 min）。
#      ⚠️ 该改动【不改变镜像内容】：重试成功拿到的仍是同一个 .deb
#      （apt 有校验和验证）。此改动仅在抖动/无代理两种网络下都无害。
#
#   3) 【scripts/in-container.sh】修一个真实 bug：卷 bootstrap 只覆盖了
#      3 个命名卷中的 1 个（rgoc-target），漏了 rgoc-cargo-registry 与
#      rgoc-cargo-git，于是第一条 cargo 命令就 Permission denied (os error 13)。
#      症状指向「读源码」，易误判为文件权限问题。
#      修法：三个卷统一进数组处理，第 5 步挂载引用同一套名字。
#
#   ⚠️ 本次也记录一个 Docker Desktop 4.94 的反直觉行为，供后来者省时间：
#      卷根属主【不跨容器保留】—— 同一容器内 chown 后 su dev 写入 OK，
#      退出后下一个容器 stat 又变回 0:0（连随机新名的卷也如此，
#      目录时间戳停在 VM 磁盘的旧日期）。
#      ⇒ 别把「stat 显示 0:0」当成故障，**判据必须落在「实际写入」**。
#      in-container.sh 每次调用都重新 stat + 按需 chown，故一切正常。
