# rgoc —— Rust 版 Go 编译器（项目代号 rgoc）
#
# 本 workspace 采用「只创建当期需要的模块」原则（03 §2）：
# M0 Phase 1 只建 rgoc-harness；其余 crate 按里程碑依赖逐个引入，
# 【不】一次性建立全部空 crate。
#
# 完整 crate 规划见 docs/03-roadmap.md §2。
#
# T37 起新增两个「工具型」crate（它们不含编译器逻辑，别当成编译器模块）：
#   rgoc-driver —— 统一 CLI 入口（`harness list/run/report`）
#   xtask       —— 构建期工具（语料枚举 / 报告生成 / manifest 生成）
#
# T40/41 起新增（Phase 3 · 三个架构 spike，决策 D-M0-13 / D-M0-14）：
#   rgoc-hir   —— **SPIKE-ONLY**，三个 spike 共享的最小 HIR，M5 整体替换
#   rgoc-spikes—— spike 的隔离载体（三个 bin + 共享 fixture），可整块删除
#
# M3（符号与类型检查入口）起新增三个**正式** crate（D-M3-8，单向依赖）：
#   rgoc-const —— 常量与大数（任意精度 + 可表示性）
#   rgoc-types —— 类型表示 + universe + Identical + 按文件的版本门控
#   rgoc-load  —— 单包多文件 + 源码 import + 导出摘要
#
# M4（静态检查闭环）起新增一个**正式** crate：
#   rgoc-check —— 静态检查主体（操作数/表达式/语句/内建/初始化序/门控；C8 诊断渲染）

[workspace]
resolver = "3"
members = [
    "crates/rgoc-ast",
    "crates/rgoc-check",
    "crates/rgoc-const",
    "crates/rgoc-driver",
    "crates/rgoc-harness",
    "crates/rgoc-hir",
    "crates/rgoc-hir-spike",
    "crates/rgoc-interp",
    "crates/rgoc-lex",
    "crates/rgoc-load",
    "crates/rgoc-parse",
    "crates/rgoc-spikes",
    "crates/rgoc-ssa",
    "crates/rgoc-types",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "BSD-3-Clause"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
